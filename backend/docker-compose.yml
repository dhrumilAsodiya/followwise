services:
  db:
    image: postgres:16
    container_name: followwise-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-followwise}
      POSTGRES_USER: ${DATABASE_USER:-followwise}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-followwise}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - followwise_pgdata:/var/lib/postgresql/data

volumes:
  followwise_pgdata:
